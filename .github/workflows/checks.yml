name: Heating Control checks
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Symcon library structure
        run: php tests/library-structure.php
      - name: PHP syntax
        run: |
          php -l RoomClimate/module.php
          php -l RoomClimate/Security.php
          php -l RoomClimate/History.php
          php -l RoomClimate/Sparklines.php
          php -l HeatingControl/FlapCalibration.php
          php -l HeatingControl/module.php
          php -l HeatingControl/HeatPumpTest.php
          php -l HeatingControl/HeatPumpTransient.php
          php -l HeatingControl/HeatPumpMeter.php
          php -l HeatingControl/HeatPumpTestReboot.php
          php -l HeatingControl/HeatPumpPerformance.php
          php -l HeatingControl/HeatPumpMatrix.php
          php -l HeatingControl/HeatPumpSurface.php
          php -l HeatingControl/HeatPumpEconomics.php
          php -l HeatingControl/HeatPumpCostAnalysis.php
          php -l HeatingControl/HeatPumpDecisionAudit.php
          php -l HeatingControl/PeriodCosts.php
          php -l HeatingControl/SourceSelection.php
          php -l HeatingControl/Webhook.php
          php -l HeatingControl/Archive.php
          php -l LichtBlickElectricityPrice/module.php
          php -l LichtBlickElectricityPrice/Economics.php
          php -l LichtBlickElectricityPrice/History.php
          php -l LichtBlickElectricityPrice/WeatherModel.php
          php -l LichtBlickElectricityPrice/Webhook.php
          php -l LichtBlickElectricityPrice/MeasuredHeating.php
          php -l LichtBlickElectricityPrice/PriceStore.php
          php -l LichtBlickElectricityPrice/PriceHistory.php
          php -l LichtBlickElectricityPrice/ConsumptionHistory.php
          php -l LichtBlickElectricityPrice/FixedPriceComparison.php
          php -l LichtBlickElectricityPrice/GasHistory.php
          php -l LichtBlickElectricityPrice/GasCosts.php
          php -l LichtBlickElectricityPrice/NoConsumption.php
          php -l LichtBlickElectricityPrice/WaterHistory.php
          php -l LichtBlickElectricityPrice/ReviewedWater.php
          php -l LichtBlickElectricityPrice/ManualWater.php
          php -l LichtBlickElectricityPrice/TotalHistory.php
          php -l LichtBlickElectricityPrice/DailyReport.php
          php -l LichtBlickElectricityPrice/DailyHeatingUsage.php
      - name: Heating behavior and web security
        run: |
          php tests/room-climate-source-settings.php
          php tests/lichtblick.php
          php tests/lichtblick-price-history.php
          php tests/lichtblick-consumption-history.php
          php tests/lichtblick-fixed-comparison.php
          php tests/lichtblick-gas-history.php
          php tests/lichtblick-gas-costs.php
          php tests/lichtblick-water-total.php
          php tests/lichtblick-daily-report.php
          php tests/lichtblick-heating-usage.php
          php tests/lichtblick-reviewed-water.php
          php -d memory_limit=64M tests/lichtblick-water-dense.php
          php tests/lichtblick-webhook.php
          php tests/lichtblick-webhook.php --no-auth-api
          php tests/heatpump-test.php
          php tests/heatpump-dedicated-meter.php
          php tests/heatpump-transients.php
          php tests/heatpump-reboot.php
          php tests/heatpump-economics.php
          php tests/heatpump-period-cost.php
          php tests/heatpump-decision-audit.php
          php tests/heatpump-surface.php
          php tests/heatpump-expansion.php
          php tests/heatpump-november.php
          php tests/form-audit.php
          php tests/measured-links.php
          php tests/source-selection.php
          php tests/price-rollover.php
          php tests/heatpump-transfer-fan.php
          php tests/flap-calibration.php
          php tests/room-editor.php
          php tests/recovery-hysteresis.php
          php tests/webhook.php
          php tests/webhook.php --no-auth-api
          php tests/archive.php
          php tests/archive.php --no-archive-api

  page-interactions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom
      - name: Page interactions
        run: |
          node tests/page-dom.cjs
          node tests/heatpump-cost-page-dom.cjs
          node tests/lichtblick-page-dom.cjs




  room-climate-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - name: Select browser
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM_BIN=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tests/room-climate-ui.cjs
      - name: Calibration banner desktop and mobile
        run: node tests/calibration-banner-ui.cjs
          node tests/heatpump-charts-ui.cjs
      - name: Save calibration banner screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-banner-screenshots
          path: |
            tests/artifacts/calibration-banner/*.png
            tests/artifacts/heatpump-charts/*.png
          if-no-files-found: ignore

